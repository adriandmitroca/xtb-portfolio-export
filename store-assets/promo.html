<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --paper: #f4f1ea; --rule: #d6cfc0; --rule-soft: #e6dfd0;
        --ink: #14120f; --muted: #6b6559; --oxblood: #7a2e2a;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", Consolas, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: var(--paper); }
      body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .tile {
        width: 440px; height: 280px; flex: 0 0 auto; position: relative; overflow: hidden;
        display: flex; align-items: center; gap: 22px; padding: 0 34px 0 46px;
        background:
          repeating-linear-gradient(to bottom, transparent 0 29px, var(--rule-soft) 29px 30px),
          var(--paper);
        font: 15px var(--serif); color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      .tile::before { content: ""; position: absolute; left: 30px; top: 0; bottom: 0; width: 1px; background: rgba(122, 46, 42, 0.38); }
      .icon { width: 76px; height: 76px; flex: 0 0 auto; display: block; }
      .txt { position: relative; z-index: 2; }
      .name { font: 400 27px/1.14 var(--serif); letter-spacing: -0.2px; }
      .name .x { font-style: italic; color: var(--oxblood); }
      .sub { font: italic 13px var(--serif); color: var(--muted); margin-top: 3px; }
      .tag { font: 600 10.5px var(--mono); color: var(--ink); text-transform: uppercase; letter-spacing: 1.1px; margin-top: 15px; padding-top: 11px; border-top: 1px solid var(--ink); display: inline-block; }
      .tag .arrow { color: var(--oxblood); }
      .badge { position: absolute; left: 46px; right: 22px; bottom: 18px; text-align: right; font: italic 10.5px var(--serif); color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="tile">
      <img class="icon" src="store-icon-128.png" alt="" />
      <div class="txt">
        <div class="name">Portfolio Export<br />for <span class="x">XTB</span></div>
        <div class="sub">unofficial</div>
        <div class="tag">Whole portfolio <span class="arrow">&rarr;</span> JSON / CSV</div>
      </div>
      <div class="badge">Runs locally &middot; no data leaves your browser</div>
    </div>
  </body>
</html>
