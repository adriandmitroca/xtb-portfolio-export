<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f1ea;
        --card: #fbf9f5;
        --rule: #d6cfc0;
        --rule-soft: #e5dfd2;
        --ink: #14120f;
        --muted: #6b6559;
        --oxblood: #7a2e2a;
        --green: #2f6b4f;
        --red: #a03a2f;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Cascadia Mono", "Roboto Mono", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 340px;
        font: 13px/1.45 var(--serif);
        background: var(--paper);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 13px 16px 11px;
        border-bottom: 3px double var(--ink);
      }
      .mark { width: 21px; height: 21px; flex: 0 0 auto; display: block; }
      .title { font-family: var(--serif); font-weight: 600; font-size: 15px; letter-spacing: 0.1px; }
      .ver { margin-left: auto; font: 500 10.5px var(--mono); color: var(--muted); letter-spacing: 0.2px; }
      main { padding: 15px 16px 10px; }

      .hero { margin-bottom: 15px; }
      .hero .label,
      .section { font: 600 9.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 1.1px; }
      .hero .value { font: 500 27px/1.1 var(--mono); letter-spacing: -1px; margin-top: 5px; font-variant-numeric: tabular-nums; }
      .hero .pl { margin-top: 5px; font: 600 12.5px var(--mono); display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
      .pos { color: var(--green); }
      .neg { color: var(--red); }
      .pl .pct { color: var(--muted); font-weight: 400; }

      /* Bucket table: ruled rows, no fills, figures right-aligned. */
      .buckets { border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); margin-bottom: 16px; }
      .brow { display: flex; align-items: baseline; gap: 8px; padding: 8px 2px; border-top: 1px solid var(--rule-soft); }
      .brow:first-child { border-top: 0; }
      .brow .bn { font-family: var(--serif); font-size: 13.5px; }
      .brow .cnt { font: 400 10px var(--mono); color: var(--muted); }
      .brow .bv { margin-left: auto; text-align: right; font-family: var(--mono); }
      .brow .bv .v { font-size: 12px; font-variant-numeric: tabular-nums; }
      .brow .bv .p { font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; }

      .empty { color: var(--muted); text-align: center; padding: 12px 4px 18px; line-height: 1.55; font-style: italic; }

      button {
        width: 100%; border: 0; border-radius: 3px; cursor: pointer;
        font: 600 13px var(--serif); padding: 11px 12px; color: var(--paper);
        transition: background 0.12s ease, opacity 0.12s ease;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      .primary { background: var(--ink); letter-spacing: 0.2px; }
      .primary:hover:not(:disabled) { background: #2c2822; }
      .exports { display: flex; gap: 7px; margin-top: 7px; }
      .ghost {
        background: var(--card); color: var(--ink); border: 1px solid var(--rule);
        font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.7px;
        padding: 9px 6px;
      }
      .ghost:hover:not(:disabled) { background: #fff; border-color: var(--ink); }
      .ghost.wide { width: 100%; margin-top: 0; }
      .hint { font: italic 11px var(--serif); color: var(--muted); text-align: center; margin: 8px 4px 2px; line-height: 1.4; }
      .section { margin: 17px 0 8px; padding-top: 13px; border-top: 1px solid var(--rule); }

      footer { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-top: 3px double var(--ink); margin-top: 8px; }
      footer .note { font: italic 10.5px/1.4 var(--serif); color: var(--muted); }
      .link { background: none; width: auto; padding: 0; color: var(--muted); font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: 0.7px; margin-left: auto; text-decoration: underline; }
      .link:hover { color: var(--ink); }
      a { color: var(--oxblood); }
      .warn {
        background: rgba(122, 46, 42, 0.07); border-left: 3px solid var(--oxblood);
        color: var(--oxblood); font: 11.5px/1.4 var(--serif); padding: 8px 10px; margin-bottom: 13px;
      }

      .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(244, 241, 234, 0.35); border-top-color: var(--paper); border-radius: 50%; animation: s 0.7s linear infinite; vertical-align: -2px; margin-right: 7px; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <header>
      <img class="mark" src="icons/icon128.png" alt="" />
      <div class="title" data-i18n="headerTitle">Portfolio Export</div>
      <div class="ver" id="ver"></div>
    </header>

    <main>
      <div id="warn" class="warn" hidden></div>
      <div id="content"><div class="empty" data-i18n="loading">Loading…</div></div>

      <button id="capture" class="primary" data-i18n="capture">Capture</button>
      <div class="hint" data-i18n="captureHint"></div>

      <div class="section" data-i18n="exportSection">Export</div>
      <button id="json" class="ghost wide" data-i18n="exportJson" data-i18n-title="tipJson">JSON</button>
      <div class="exports">
        <button id="csvPos" class="ghost" data-i18n="exportPositions" data-i18n-title="tipPositions">Positions</button>
        <button id="csvPlans" class="ghost" data-i18n="exportPlans" data-i18n-title="tipPlans">Plans</button>
        <button id="csvHist" class="ghost" data-i18n="exportHistory" data-i18n-title="tipHistory">History</button>
      </div>
    </main>

    <footer>
      <div class="note" data-i18n="footerNote">Unofficial. Your data never leaves the browser.</div>
      <button id="clear" class="link" data-i18n="clear" data-i18n-title="tipClear">Clear</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
